name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal sequence, ideally starting from a fresh clone.
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Output of bin/health.py
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version and Claude Code version.
      placeholder: Debian 13, Python 3.13, Claude Code 2.x
    validations:
      required: true
